version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/youtube_cookies.txt:/app/youtube_cookies.txt
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/local-files')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - karaoke-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - karaoke-net
    depends_on:
      - backend

networks:
  karaoke-net:
    driver: bridge
